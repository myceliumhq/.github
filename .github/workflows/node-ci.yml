name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      # build before typecheck: a multi-package repo's typecheck resolves
      # sibling workspace packages (e.g. @myceliumhq/index -> @myceliumhq/
      # embed) via each package's own dist/*.d.ts, which only exist once
      # build has run -- typecheck first would fail with "Cannot find
      # module" on a clean checkout even though the code is correct.
      - run: pnpm run build

      - run: pnpm run typecheck

      - run: pnpm run test

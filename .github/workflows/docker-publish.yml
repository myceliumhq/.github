name: Docker Publish

# Builds and pushes one Dockerfile to GHCR, tagged with `inputs.tag` (e.g.
# v1.2.3 -- kept as-is, matching the npm package's own tagged version; no
# ":latest", images are pinned everywhere they're deployed).
#
# `tag`/`ref` are always explicit inputs, never inferred from github.ref_name
# -- the caller is expected to be triggered by `workflow_run` on its own
# "Release" workflow completing (not `push: tags:`), because a tag pushed
# using the release job's own GITHUB_TOKEN does NOT trigger downstream
# `on: push` workflows (GitHub's anti-recursion guard). workflow_run doesn't
# have that restriction, but it also doesn't carry a tag ref of its own, so
# the caller has to resolve "what tag did the release just create" itself
# (see tri's docker-semanticd.yml) and hand both here explicitly.

on:
  workflow_call:
    inputs:
      image:
        description: "Image name under ghcr.io/myceliumhq/"
        type: string
        required: true
      dockerfile:
        description: "Path to the Dockerfile to build"
        type: string
        required: true
      tag:
        description: "Image tag to publish under, e.g. v1.2.3"
        type: string
        required: true
      ref:
        description: "Git ref to check out and build (typically the same as tag)"
        type: string
        required: true
      context:
        description: "Build context"
        type: string
        default: "."

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ghcr.io/myceliumhq/${{ inputs.image }}:${{ inputs.tag }}

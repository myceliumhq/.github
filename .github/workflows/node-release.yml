name: Node Release

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Required to mint the OIDC JWT for npm trusted publishing --
      # @semantic-release/npm (v13.1.0+) auto-detects an OIDC-eligible
      # context and uses it instead of an NPM_TOKEN. Note: npm validates
      # the trusted-publisher config against the *calling* workflow file in
      # the product repo (e.g. tri/.github/workflows/release.yml), not this
      # shared reusable workflow -- id-token: write must be granted in both
      # the caller and here, or the OIDC token can't be minted at all.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      # npm trusted publishing (OIDC) needs npm >=11.5.1 for the actual
      # `npm publish` invocation, not just @semantic-release/npm's own
      # pre-flight OIDC check -- the npm bundled with Node 22 on the
      # runner is older than that, so `npm publish` shells out to a
      # binary that doesn't know how to do the token exchange and fails
      # with ENEEDAUTH even though verifyConditions already succeeded.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run test

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
